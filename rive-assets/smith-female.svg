<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 -128 90 138" width="270" height="414">
  <!--
    FORGE COMPANION — FEMALE BLACKSMITH ("Blacksmithette")
    Same body, same job, same gear. Different hair and bandana colour.
    Coordinate origin = foot centre (0,0).
    Group "hammer-arm" and "head" work identically to the male file.
    In Rive: both files share the SAME state machine / animation names.
    Toggle visibility via a Boolean input "IsFemale" in the state machine.
  -->

  <!-- GROUND SHADOW -->
  <ellipse cx="0" cy="1" rx="19" ry="4" fill="#000" opacity=".45"/>

  <!-- LEGS -->
  <rect x="-13" y="-28" width="11" height="29" rx="4" fill="#2A3040"/>
  <rect x="2"   y="-26" width="11" height="27" rx="4" fill="#2A3040"/>

  <!-- BOOTS -->
  <path d="M-16-2 Q-15 2 -6 2 L-6-1 L-14-2 Z" fill="#3A2A18"/>
  <path d="M1-1 Q1 3 10 3 L11-1 L2-2 Z"        fill="#3A2A18"/>

  <!-- TORSO (same as male) -->
  <rect x="-16" y="-66" width="32" height="40" rx="7" fill="#2E3848"/>

  <!-- LEATHER APRON -->
  <path d="M-12-60 L12-60 L14-28 L-14-28 Z" fill="#5C3A1C"/>
  <line x1="0" y1="-60" x2="0" y2="-28" stroke="#4A2E14" stroke-width="1.5" opacity=".5"/>
  <rect x="-5" y="-44" width="10" height="8" rx="2" fill="#4A2E14" opacity=".8"/>
  <line x1="-12" y1="-60" x2="-8"  y2="-70" stroke="#5C3A1C" stroke-width="2.5"/>
  <line x1="12"  y1="-60" x2="8"   y2="-70" stroke="#5C3A1C" stroke-width="2.5"/>

  <!-- LEFT ARM + TONGS -->
  <rect x="-24" y="-64" width="9" height="28" rx="4" fill="#C08850"/>
  <path d="M-24-38 Q-28-36 -26-32 Q-24-28 -20-30 L-20-36 Z" fill="#9B6E4A"/>
  <line x1="-24" y1="-32" x2="-27" y2="-47" stroke="#6A6860" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-22" y1="-32" x2="-24" y2="-47" stroke="#6A6860" stroke-width="2"   stroke-linecap="round"/>

  <!-- RIGHT ARM + HAMMER -->
  <g id="hammer-arm">
    <rect x="13" y="-64" width="9" height="28" rx="4" fill="#C08850"/>
    <path d="M13-38 Q17-36 18-32 Q19-28 15-29 L13-35 Z" fill="#9B6E4A"/>
    <rect x="16" y="-86" width="4.5" height="30" rx="2.25" fill="#5C3E20"/>
    <rect x="9"  y="-98" width="20" height="14" rx="3.5" fill="#6A6860"/>
    <rect x="9"  y="-98" width="20" height="4"  rx="1.5" fill="#8A8880" opacity=".5"/>
    <rect x="9"  y="-88" width="20" height="4"  rx="1.5" fill="#5A5858" opacity=".4"/>
  </g>

  <!-- HEAD GROUP -->
  <g id="head">
    <!-- Neck -->
    <rect x="-7" y="-78" width="14" height="10" rx="5" fill="#C08850"/>
    <!-- Head (slightly rounder) -->
    <ellipse cx="0" cy="-91" rx="16" ry="20" fill="#D49060"/>
    <!-- Hair base (dark, same as male) -->
    <path d="M-16-98 Q-16-116 0-118 Q16-116 16-98 L13-98 Q13-114 0-116 Q-13-114 -13-98 Z" fill="#1A1412"/>
    <!-- Side locks (longer, falls past jawline on one side) -->
    <path d="M-16-98 Q-18-88 -17-76 Q-16-70 -13-68" fill="none" stroke="#1A1412" stroke-width="6" stroke-linecap="round"/>
    <!-- Hair bun at back top -->
    <ellipse cx="8" cy="-112" rx="7" ry="6" fill="#1A1412"/>
    <ellipse cx="8" cy="-112" rx="5" ry="4" fill="#2A2018"/>
    <!-- Bandana (teal = female, distinct from male red) -->
    <path d="M-16-98 Q-16-107 0-110 Q16-107 16-98" fill="none" stroke="#1E7A60" stroke-width="3.5" opacity=".9"/>
    <path d="M16-98 Q20-100 18-95 Q16-90 14-92" fill="#1E7A60" opacity=".75"/>
    <!-- Eye sockets -->
    <ellipse cx="-5.5" cy="-90" rx="4" ry="3.5" fill="#B07030" opacity=".18"/>
    <ellipse cx="5.5"  cy="-90" rx="4" ry="3.5" fill="#B07030" opacity=".18"/>
    <!-- Eyes (slightly larger) -->
    <circle cx="-5.5" cy="-90" r="3.0" fill="#1A1412"/>
    <circle cx="5.5"  cy="-90" r="3.0" fill="#1A1412"/>
    <circle cx="-4.2" cy="-91" r="1.2" fill="#FFF" opacity=".85"/>
    <circle cx="6.8"  cy="-91" r="1.2" fill="#FFF" opacity=".85"/>
    <!-- Lashes (top) -->
    <path d="M-9-93 Q-7-95 -2.5-93.5" fill="none" stroke="#1A1412" stroke-width="1.2" opacity=".7"/>
    <path d="M2.5-93.5 Q7-95 9-93" fill="none" stroke="#1A1412" stroke-width="1.2" opacity=".7"/>
    <!-- Brows (thinner, slightly arched) -->
    <path d="M-8.5-94 Q-5.5-96.5 -2-94" fill="none" stroke="#5A3018" stroke-width="1.2" opacity=".5"/>
    <path d="M2-94 Q5.5-96.5 8.5-94"   fill="none" stroke="#5A3018" stroke-width="1.2" opacity=".5"/>
    <!-- Nose -->
    <path d="M-2.5-83 Q0-81 2.5-83" fill="none" stroke="#A06830" stroke-width="1.3" opacity=".5"/>
    <!-- Mouth (slight smile) -->
    <path d="M-5-78 Q-2-76.5 0-76.5 Q2-76.5 5-78" fill="none" stroke="#8B3828" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Jaw shadow -->
    <path d="M-15-97 Q-16-84 -12-77" stroke="#A06030" stroke-width="1.5" fill="none" opacity=".2"/>
    <path d="M15-97  Q16-84  12-77"  stroke="#A06030" stroke-width="1.5" fill="none" opacity=".2"/>
    <!-- Cheek highlights (more visible) -->
    <ellipse cx="-10" cy="-83" rx="5.5" ry="3" fill="#E07848" opacity=".16"/>
    <ellipse cx="10"  cy="-83" rx="5.5" ry="3" fill="#E07848" opacity=".16"/>
  </g>
</svg>
