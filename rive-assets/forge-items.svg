<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="960" height="240">
  <!--
    FORGE ITEMS — ALL 10 AT STAGE 4 (FORGED / GOLD)
    Stage 4 palette: fill #C8902A  edge/stroke #F5C842  grip #5C3E20
    Each item sits in a 48×100 slot. Origin at top-left of each slot.
    Translate each group to its slot position, then each item is drawn
    centred at (24, 60) within the slot.

    In Rive: import this file, then split into 10 artboards or 10 groups.
    Each group visibility is driven by a Number input "ItemType" (0-9).
    Item order: 0=Sword 1=Dagger 2=Shield 3=Helmet 4=Axe 5=Pick 6=Banner 7=Charm 8=Armour 9=Aegis
  -->

  <!-- ── 0: SWORD ── slot x=0 -->
  <g transform="translate(24,60)">
    <path d="M-3.5-44 L3.5-44 L4.5 12 L0 18 L-4.5 12 Z" fill="#C8902A"/>
    <line x1="0" y1="-40" x2="0" y2="10" stroke="#F5C842" stroke-width=".7" opacity=".6"/>
    <path d="M3.5-44 L4.5 12 L3 10 L2.5-42 Z" fill="#F5C842" opacity=".18"/>
    <path d="M-17.5 12 L17.5 12 L15.5 18 L-15.5 18 Z" fill="#C8902A"/>
    <rect x="-5" y="18" width="10" height="24" rx="4" fill="#5C3E20"/>
    <line x1="-5" y1="20"   x2="5" y2="20"   stroke="#8B6A3A" stroke-width="1.2" opacity=".6"/>
    <line x1="-5" y1="22.5" x2="5" y2="22.5" stroke="#8B6A3A" stroke-width="1.2" opacity=".6"/>
    <line x1="-5" y1="25"   x2="5" y2="25"   stroke="#8B6A3A" stroke-width="1.2" opacity=".6"/>
    <line x1="-5" y1="27.5" x2="5" y2="27.5" stroke="#8B6A3A" stroke-width="1.2" opacity=".6"/>
    <line x1="-5" y1="30"   x2="5" y2="30"   stroke="#8B6A3A" stroke-width="1.2" opacity=".6"/>
    <line x1="-5" y1="32.5" x2="5" y2="32.5" stroke="#8B6A3A" stroke-width="1.2" opacity=".6"/>
    <circle cx="0" cy="46" r="8" fill="#C8902A"/>
    <circle cx="0" cy="46" r="5.5" fill="#F5C842" opacity=".22"/>
    <text x="0" y="-16" text-anchor="middle" font-size="7" fill="#F5C842" opacity=".75" font-family="serif">⟡</text>
  </g>

  <!-- ── 1: DAGGER ── slot x=48 -->
  <g transform="translate(72,60)">
    <path d="M-3.5-32 L3.5-32 L3.5 6 L0 12 L-3.5 6 Z" fill="#C8902A"/>
    <line x1="0" y1="-30" x2="0" y2="4" stroke="#F5C842" stroke-width=".6" opacity=".6"/>
    <path d="M3.5-32 L3.5 6 L2.5 4 L2-30 Z" fill="#F5C842" opacity=".18"/>
    <rect x="-13" y="12" width="26" height="5" rx="2.5" fill="#C8902A"/>
    <rect x="-3.5" y="17" width="7" height="15" rx="3" fill="#5C3E20"/>
    <line x1="-3.5" y1="19" x2="3.5" y2="19" stroke="#8B6A3A" stroke-width="1" opacity=".55"/>
    <line x1="-3.5" y1="21" x2="3.5" y2="21" stroke="#8B6A3A" stroke-width="1" opacity=".55"/>
    <line x1="-3.5" y1="23" x2="3.5" y2="23" stroke="#8B6A3A" stroke-width="1" opacity=".55"/>
    <line x1="-3.5" y1="25" x2="3.5" y2="25" stroke="#8B6A3A" stroke-width="1" opacity=".55"/>
    <line x1="-3.5" y1="27" x2="3.5" y2="27" stroke="#8B6A3A" stroke-width="1" opacity=".55"/>
    <circle cx="0" cy="36" r="5.5" fill="#C8902A"/>
    <circle cx="0" cy="36" r="3.5" fill="#F5C842" opacity=".2"/>
  </g>

  <!-- ── 2: SHIELD ── slot x=96 -->
  <g transform="translate(120,60)">
    <path d="M0-28 L20-15 L20 6 Q20 26 0 28 Q-20 26 -20 6 L-20-15 Z" fill="#C8902A"/>
    <path d="M0-20 L12-11 L12 3 Q12 17 0 19 Q-12 17 -12 3 L-12-11 Z" fill="#F5C842" opacity=".13"/>
    <line x1="0" y1="-22" x2="0"  y2="18" stroke="#F5C842" stroke-width=".6" opacity=".45"/>
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#F5C842" stroke-width=".6" opacity=".3"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" fill="#F5C842" opacity=".6" font-family="serif">⟡</text>
    <circle cx="0" cy="0" r="4" fill="#F5C842" opacity=".12"/>
  </g>

  <!-- ── 3: HELMET ── slot x=144 -->
  <g transform="translate(168,60)">
    <path d="M-18 10 Q-18-30 0-30 Q18-30 18 10 Z" fill="#C8902A"/>
    <rect x="-20" y="8" width="40" height="5.5" rx="2.75" fill="#C8902A"/>
    <rect x="-2" y="-10" width="4" height="18" rx="2" fill="#F5C842" opacity=".7"/>
    <path d="M-18 10 L-18 24 Q-18 28 -11 28 L-11 10 Z" fill="#C8902A" opacity=".88"/>
    <path d="M18 10 L18 24 Q18 28 11 28 L11 10 Z"   fill="#C8902A" opacity=".88"/>
    <path d="M0-30 Q5-44 0-42 Q-5-44 0-30" fill="#F5C842" opacity=".8"/>
    <line x1="-14" y1="1" x2="14" y2="1" stroke="#F5C842" stroke-width=".5" opacity=".3"/>
  </g>

  <!-- ── 4: AXE ── slot x=192 -->
  <g transform="translate(216,55)">
    <rect x="-3" y="-4" width="6" height="36" rx="3" fill="#8B6914"/>
    <path d="M-3-4 L-20-22 Q-26-30 -14-32 Q-4-28 8-18 Q16-8 12 2 L-3-4 Z" fill="#C8902A"/>
    <path d="M-3 8 Q0 4 3 8 L3 18 Q0 22 -3 18 Z" fill="#C8902A" opacity=".55"/>
    <line x1="-19" y1="-20" x2="11" y2="2" stroke="#F5C842" stroke-width=".7" opacity=".45"/>
    <text x="-6" y="-12" text-anchor="middle" font-size="6" fill="#F5C842" opacity=".7" font-family="serif">⟡</text>
  </g>

  <!-- ── 5: PICK ── slot x=240 -->
  <g transform="translate(264,55)">
    <rect x="-2" y="-6" width="4" height="32" rx="2" fill="#8B6914"/>
    <path d="M-2-6 L-14-18 Q-18-22 -12-22 L10-8 Q14-4 10 0 L-2-6 Z" fill="#C8902A"/>
    <path d="M-2-6 L14-18 Q18-22 12-22 L10-8 Z" fill="#C8902A" opacity=".75"/>
    <line x1="-13" y1="-16" x2="9" y2="-6" stroke="#F5C842" stroke-width=".5" opacity=".45"/>
  </g>

  <!-- ── 6: WAR BANNER ── slot x=288 -->
  <g transform="translate(312,52)">
    <rect x="-2.5" y="-30" width="5" height="60" rx="2.5" fill="#8B6914"/>
    <path d="M2.5-26 L32-14 L32 8 L2.5 14 Z" fill="#C8902A" opacity=".92"/>
    <polygon points="0,-30 -4,-21 4,-21" fill="#C8902A" opacity=".9"/>
    <text x="17" y="-3" text-anchor="middle" font-size="7" fill="#F5C842" opacity=".7" font-family="serif">⟡</text>
  </g>

  <!-- ── 7: CHARM (Hex Gem) ── slot x=336 -->
  <g transform="translate(360,60)">
    <path d="M0-15 L13-7 L13 7 L0 15 L-13 7 L-13-7 Z" fill="#C8902A"/>
    <path d="M0-15 L4-12 L13-7" fill="none" stroke="#FFF" stroke-width=".7" opacity=".15"/>
    <path d="M0-9 L8-4 L8 4 L0 9 L-8 4 L-8-4 Z" fill="#F5C842" opacity=".2"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#F5C842" stroke-width=".5" opacity=".2"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#F5C842" opacity=".75" font-family="serif">✦</text>
  </g>

  <!-- ── 8: ARMOUR ── slot x=384 -->
  <g transform="translate(408,58)">
    <path d="M-16-18 Q-16-28 0-28 Q16-28 16-18 L18 10 Q18 20 0 22 Q-18 20 -18 10 Z" fill="#C8902A"/>
    <path d="M-16-18 Q-22-18 -24-10 Q-24-4 -18 0 L-16 0 L-16-18 Z" fill="#C8902A" opacity=".9"/>
    <path d="M16-18 Q22-18 24-10 Q24-4 18 0 L16 0 L16-18 Z"  fill="#C8902A" opacity=".9"/>
    <line x1="0" y1="-24" x2="0"  y2="18" stroke="#F5C842" stroke-width=".7" opacity=".4"/>
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#F5C842" stroke-width=".5" opacity=".35"/>
    <text x="0" y="4" text-anchor="middle" font-size="9" fill="#F5C842" opacity=".55" font-family="serif">⟡</text>
    <path d="M-16-18 L16-18 L14-16 L-14-16 Z" fill="#F5C842" opacity=".1"/>
  </g>

  <!-- ── 9: AEGIS (Great Shield) ── slot x=432 -->
  <g transform="translate(456,58)">
    <path d="M0-30 L24-16 L24 8 Q24 34 0 38 Q-24 34 -24 8 L-24-16 Z" fill="#C8902A"/>
    <path d="M0-30 L26-16 L28 8 Q0 40 0 40 Q-28 8 -28-16 Z" fill="none" stroke="#F5C842" stroke-width="1.5" opacity=".2"/>
    <path d="M0-20 L14-10 L14 5 Q14 20 0 22 Q-14 20 -14 5 L-14-10 Z" fill="#F5C842" opacity=".12"/>
    <line x1="0" y1="-24" x2="0"  y2="22"  stroke="#F5C842" stroke-width=".7" opacity=".4"/>
    <text x="0" y="6" text-anchor="middle" font-size="14" fill="#F5C842" opacity=".55" font-family="serif">⟡</text>
    <circle cx="0" cy="0" r="6" fill="#F5C842" opacity=".08"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#F5C842" stroke-width=".5" opacity=".25"/>
  </g>
</svg>
