<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35 -122 90 132" width="270" height="396">
  <!--
    FORGE COMPANION — MALE BLACKSMITH
    Coordinate origin = foot centre (0,0). Body extends upward (negative Y).
    Group "hammer-arm" gets the single rotation bone (pivot at 14,-62 relative to origin).
    Group "head" gets the subtle head-tilt bone (pivot at 0,-78).
    Import into Rive by dragging this file onto the artboard.
  -->

  <!-- GROUND SHADOW -->
  <ellipse cx="0" cy="1" rx="19" ry="4" fill="#000" opacity=".45"/>

  <!-- LEGS -->
  <rect x="-13" y="-28" width="11" height="29" rx="4" fill="#2A3040"/>
  <rect x="2"   y="-26" width="11" height="27" rx="4" fill="#2A3040"/>

  <!-- BOOTS -->
  <path d="M-16-2 Q-15 2 -6 2 L-6-1 L-14-2 Z" fill="#3A2A18"/>
  <path d="M1-1 Q1 3 10 3 L11-1 L2-2 Z"        fill="#3A2A18"/>

  <!-- TORSO -->
  <rect x="-16" y="-66" width="32" height="40" rx="7" fill="#2E3848"/>

  <!-- LEATHER APRON -->
  <path d="M-12-60 L12-60 L14-28 L-14-28 Z" fill="#5C3A1C"/>
  <line x1="0" y1="-60" x2="0" y2="-28" stroke="#4A2E14" stroke-width="1.5" opacity=".5"/>
  <rect x="-5" y="-44" width="10" height="8" rx="2" fill="#4A2E14" opacity=".8"/>
  <line x1="-12" y1="-60" x2="-8"  y2="-70" stroke="#5C3A1C" stroke-width="2.5"/>
  <line x1="12"  y1="-60" x2="8"   y2="-70" stroke="#5C3A1C" stroke-width="2.5"/>

  <!-- LEFT ARM + TONGS (tongs reach anvil at y≈-47) -->
  <rect x="-24" y="-64" width="9" height="28" rx="4" fill="#B87840"/>
  <path d="M-24-38 Q-28-36 -26-32 Q-24-28 -20-30 L-20-36 Z" fill="#8B5E3C"/>
  <line x1="-24" y1="-32" x2="-27" y2="-47" stroke="#6A6860" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-22" y1="-32" x2="-24" y2="-47" stroke="#6A6860" stroke-width="2"   stroke-linecap="round"/>

  <!--
    RIGHT ARM + HAMMER
    *** THIS ENTIRE GROUP BECOMES "hammer-arm" IN RIVE ***
    Bone pivot: (14, -62) in this SVG's coordinate space.
    Animation: rotate from 0° → +45° (windup) → -140° (strike anvil) → return.
  -->
  <g id="hammer-arm">
    <!-- Upper arm -->
    <rect x="13" y="-64" width="9" height="28" rx="4" fill="#B87840"/>
    <!-- Elbow -->
    <path d="M13-38 Q17-36 18-32 Q19-28 15-29 L13-35 Z" fill="#8B5E3C"/>
    <!-- Handle -->
    <rect x="16" y="-86" width="4.5" height="30" rx="2.25" fill="#5C3E20"/>
    <!-- Hammer head body -->
    <rect x="9"  y="-98" width="20" height="14" rx="3.5" fill="#6A6860"/>
    <!-- Hammer head top highlight -->
    <rect x="9"  y="-98" width="20" height="4"  rx="1.5" fill="#8A8880" opacity=".5"/>
    <!-- Hammer head bottom band -->
    <rect x="9"  y="-88" width="20" height="4"  rx="1.5" fill="#5A5858" opacity=".4"/>
  </g>

  <!--
    HEAD GROUP
    *** THIS ENTIRE GROUP BECOMES "head" IN RIVE ***
    Bone pivot: (0, -78). Animation: subtle tilt ±2°.
  -->
  <g id="head">
    <!-- Neck -->
    <rect x="-7" y="-78" width="14" height="10" rx="5" fill="#B87840"/>
    <!-- Head -->
    <ellipse cx="0" cy="-90" rx="17" ry="19" fill="#C8844A"/>
    <!-- Hair -->
    <path d="M-17-97 Q-17-110 0-112 Q17-110 17-97 L13-97 Q13-108 0-110 Q-13-108 -13-97 Z" fill="#1A1412"/>
    <!-- Bandana (red = male) -->
    <path d="M-17-97 Q-17-106 0-108 Q17-106 17-97" fill="none" stroke="#C04018" stroke-width="3.5" opacity=".88"/>
    <path d="M17-97 Q21-99 19-94 Q17-89 15-91" fill="#C04018" opacity=".7"/>
    <!-- Eye sockets -->
    <ellipse cx="-5.5" cy="-89" rx="4" ry="3.5" fill="#B07030" opacity=".2"/>
    <ellipse cx="5.5"  cy="-89" rx="4" ry="3.5" fill="#B07030" opacity=".2"/>
    <!-- Eyes -->
    <circle cx="-5.5" cy="-89" r="2.8" fill="#1A1412"/>
    <circle cx="5.5"  cy="-89" r="2.8" fill="#1A1412"/>
    <!-- Eye gleams -->
    <circle cx="-4.5" cy="-90" r="1.1" fill="#FFF" opacity=".82"/>
    <circle cx="6.5"  cy="-90" r="1.1" fill="#FFF" opacity=".82"/>
    <!-- Brows -->
    <path d="M-9-93 Q-5.5-95 -2-93" fill="none" stroke="#8B4820" stroke-width="1.5" opacity=".4"/>
    <path d="M2-93  Q5.5-95  9-93"  fill="none" stroke="#8B4820" stroke-width="1.5" opacity=".4"/>
    <!-- Nose -->
    <path d="M-3-84 Q0-82 3-84" fill="none" stroke="#A06830" stroke-width="1.5" opacity=".5"/>
    <!-- Mouth (neutral set jaw) -->
    <path d="M-5-78 Q0-76 5-78" fill="none" stroke="#8B4820" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Jaw shadow -->
    <path d="M-16-96 Q-17-82 -13-76" stroke="#A06030" stroke-width="1.5" fill="none" opacity=".25"/>
    <path d="M16-96  Q17-82  13-76"  stroke="#A06030" stroke-width="1.5" fill="none" opacity=".25"/>
    <!-- Cheek highlights -->
    <ellipse cx="-10" cy="-83" rx="5" ry="3" fill="#E07040" opacity=".12"/>
    <ellipse cx="10"  cy="-83" rx="5" ry="3" fill="#E07040" opacity=".12"/>
  </g>
</svg>
